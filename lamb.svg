  <!-- шерсть -->
  <g fill="#e7d8c6">
    <circle cx="64" cy="70" r="19"/>
    <circle cx="84" cy="50" r="21"/>
    <circle cx="108" cy="46" r="22"/>
    <circle cx="132" cy="62" r="20"/>
    <circle cx="142" cy="84" r="17"/>
    <circle cx="130" cy="104" r="18"/>
    <circle cx="72" cy="104" r="18"/>
    <circle cx="58" cy="86" r="17"/>
    <circle cx="100" cy="96" r="25"/>
  </g>
  <g fill="#d3bfa9" opacity=".55">
    <circle cx="70" cy="58" r="7"/>
    <circle cx="122" cy="52" r="8"/>
    <circle cx="138" cy="92" r="6"/>
  </g>

  <!-- капюшон -->
